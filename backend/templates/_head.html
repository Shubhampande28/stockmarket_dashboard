{# Shared <head> partial: AdSense + GA4 on every page, per brief sec 10. #}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
{% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/theme.css">

{% if og_title %}
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ og_description or description }}">
<meta property="og:type" content="{{ og_type or 'website' }}">
<meta property="og:image" content="{{ og_image or (request.url_root ~ 'og/mood.png') }}">
<meta property="og:url" content="{{ canonical_url or request.url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ og_description or description }}">
<meta name="twitter:image" content="{{ og_image or (request.url_root ~ 'og/mood.png') }}">
{% endif %}

{% if schema_json %}
<script type="application/ld+json">{{ schema_json | safe }}</script>
{% endif %}

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4327209189250322" crossorigin="anonymous"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HMR5QMX690"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-HMR5QMX690');
</script>
